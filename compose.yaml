services:
  frontend:
    build:
      context: ./Frontend/Task-manager

    ports:
      - "3000:3000"

    depends_on:
      - backend


  backend:
    build:
      context: ./server

    ports:
      - "5000:5000"

    environment:
      connection_string: ${connection_string}
      AccessToken_Secret: ${AccessToken_Secret}

      